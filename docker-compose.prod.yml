x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poketeam-app
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging

networks:
  homelab:
    external: true
